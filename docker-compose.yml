services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: node bot.js
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      STEAM_API_KEY: ${STEAM_API_KEY:?STEAM_API_KEY is required}
      DB_FILE: /data/settings.json
    volumes:
      - bot-data:/data

volumes:
  bot-data:
