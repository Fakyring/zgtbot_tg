services:
  tor-proxy:
    image: dockage/tor-privoxy:latest
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "sleep 60 && node bot.js"
    restart: unless-stopped
    depends_on:
      - tor-proxy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      STEAM_API_KEY: ${STEAM_API_KEY:?STEAM_API_KEY is required}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://tor-proxy:8118}
      START_RETRY_DELAY_MS: ${START_RETRY_DELAY_MS:-30000}
      DB_FILE: /data/settings.json
    volumes:
      - bot-data:/data

volumes:
  bot-data:
